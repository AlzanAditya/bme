<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Berkah Maju Elektrik - Generator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CDN Asset Loader for i-ui Icon Component -->
    <script>
      (function () {
        const isLocal = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.protocol === 'file:';

        const cdnBase = '/cdn';

        const preloadLink = document.createElement('link');
        preloadLink.rel = 'preload';
        preloadLink.href = cdnBase + '/icons/untitled-ui-line.v1.json';
        preloadLink.as = 'fetch';
        preloadLink.crossOrigin = 'anonymous';
        document.head.appendChild(preloadLink);

        const scriptEl = document.createElement('script');
        scriptEl.src = cdnBase + '/js/i-ui.js';
        scriptEl.defer = true;
        document.head.appendChild(scriptEl);
      })();
    </script>

    <!-- html-to-image Library -->
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

    <!-- Manifest and Favicons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="/assets/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#4A90E2">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
